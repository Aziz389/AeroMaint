spring:
  application:
    name: aeromaint

  # Load secrets from the .env file (repo root or backend/ folder) if it exists.
  # Real environment variables (e.g. in Docker) take priority over this file.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match the tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Monitoring (Spring Boot Actuator + Micrometer)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus   # only these three; nothing else is exposed
  metrics:
    tags:
      application: aeromaint                # added to every metric, used to filter in Grafana
    distribution:
      # Records request durations in buckets so Prometheus can compute p95 / p99 latency.
      percentiles-histogram:
        http.server.requests: true

# Our own settings (read by JwtService and DemoPasswordInitializer)
aeromaint:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  # Password given to the seeded demo users on first start. Empty = demo users stay locked.
  demo-password: ${DEMO_PASSWORD:}
  # Preventive maintenance job: first run 15 s after startup, then every hour.
  scheduler:
    initial-delay-ms: ${SCHEDULER_INITIAL_DELAY_MS:15000}
    interval-ms: ${SCHEDULER_INTERVAL_MS:3600000}
