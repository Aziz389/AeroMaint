<mat-toolbar class="toolbar">
  <a routerLink="/tickets" class="brand">
    <mat-icon>flight_takeoff</mat-icon>
    <span>AeroMaint</span>
    <span class="airport">SFA</span>
  </a>

  <nav>
    <a mat-button routerLink="/tickets" routerLinkActive="active">
      <mat-icon>confirmation_number</mat-icon>
      {{ auth.hasRole('TECHNICIAN') ? 'My tickets' : 'Tickets' }}
    </a>
    <a mat-button routerLink="/equipment" routerLinkActive="active">
      <mat-icon>precision_manufacturing</mat-icon>
      Equipment
    </a>
  </nav>

  <span class="spacer"></span>

  @if (auth.currentUser(); as user) {
    <span class="user">
      <span class="user-name">{{ user.fullName }}</span>
      <span class="chip">{{ user.role }}</span>
    </span>
  }
  <button mat-icon-button (click)="auth.logout()" aria-label="Log out" title="Log out">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<main>
  <router-outlet />
</main>
