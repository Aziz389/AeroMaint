<div class="page">
  <div class="page-header">
    <h1>Equipment</h1>
    @if (isAdmin()) {
      <a mat-flat-button routerLink="/equipment/new">
        <mat-icon>add</mat-icon>
        New equipment
      </a>
    }
  </div>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }
  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="table-scroll">
    <table mat-table [dataSource]="equipment()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let e">{{ e.name }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let e">{{ e.type }}</td>
      </ng-container>

      <ng-container matColumnDef="zone">
        <th mat-header-cell *matHeaderCellDef>Zone</th>
        <td mat-cell *matCellDef="let e">{{ e.zoneName }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let e"><span class="chip equip-{{ e.status }}">{{ e.status }}</span></td>
      </ng-container>

      <ng-container matColumnDef="installedAt">
        <th mat-header-cell *matHeaderCellDef>Installed</th>
        <td mat-cell *matCellDef="let e">{{ e.installedAt | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let e">
          <a mat-icon-button [routerLink]="['/equipment', e.id, 'edit']" (click)="$event.stopPropagation()"
             aria-label="Edit equipment" title="Edit">
            <mat-icon>edit</mat-icon>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns()"></tr>
      <tr mat-row *matRowDef="let row; columns: columns()" [class.clickable-row]="canOpenHistory()" (click)="open(row)"></tr>
    </table>
  </div>
</div>
