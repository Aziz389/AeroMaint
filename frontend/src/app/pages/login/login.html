<div class="login-wrapper">
  <mat-card class="login-card" appearance="outlined">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <mat-card-header>
      <mat-icon mat-card-avatar class="logo">flight_takeoff</mat-icon>
      <mat-card-title>AeroMaint</mat-card-title>
      <mat-card-subtitle>Sfax-Thyna International Airport · Maintenance</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          @if (form.controls.username.hasError('required')) {
            <mat-error>Username is required</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          @if (form.controls.password.hasError('required')) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        @if (error()) {
          <p class="error-text">{{ error() }}</p>
        }

        <button mat-flat-button type="submit" class="full-width" [disabled]="loading()">Sign in</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
