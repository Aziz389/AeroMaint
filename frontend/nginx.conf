# Nginx inside the frontend container.
# - Serves the Angular files.
# - Forwards /api/... to the backend container, so the browser talks to a single address
#   (same role as proxy.conf.json in development: no CORS needed).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend service (its name in docker-compose is "backend").
    # "^~" = if the path starts with /api/, use this block and skip the regex blocks below.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routes (/tickets/3, /dashboard...) are handled in the browser:
    # if the file does not exist, return index.html and let the Angular router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files have a hash in their name, so they can be cached for a long time.
    location ~* \.(js|css|woff2?|ico|svg|png)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, so users always get the latest version after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
