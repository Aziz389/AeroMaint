# AeroMaint full stack: MySQL + Spring Boot backend + Angular/Nginx frontend.
#
#   docker compose up -d --build     build images and start everything
#   docker compose logs -f backend   follow the backend log
#   docker compose down              stop (data is kept in the mysql-data volume)
#   docker compose down -v           stop AND delete the database
#
# Secrets come from the .env file next to this file (never committed; see .env.example).
# ${VAR:?message} makes Compose stop with an error if the variable is missing.

name: aeromaint

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aeromaint
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${TZ:-Africa/Tunis}
    volumes:
      - mysql-data:/var/lib/mysql
    # No "ports": the database is only reachable by the other containers, not from outside.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    image: aeromaint-backend:latest
    restart: unless-stopped
    mem_limit: 1g     # the JVM uses up to 75% of this for its heap (-XX:MaxRAMPercentage=75 in the Dockerfile)
    depends_on:
      mysql:
        condition: service_healthy   # wait until MySQL accepts connections, not just "container started"
    environment:
      # "mysql" is the service name above: Docker's internal DNS resolves it to the MySQL container.
      DB_URL: jdbc:mysql://mysql:3306/aeromaint
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # Containers run in UTC by default; the airport works in Tunisian time.
      # This matters for "today" in the maintenance scheduler and for ticket timestamps.
      TZ: ${TZ:-Africa/Tunis}
    ports:
      - "8080:8080"   # exposed only for Swagger UI; the frontend reaches the backend through Nginx

  frontend:
    build: ./frontend
    image: aeromaint-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"     # open http://localhost:8088 (port 80 is often taken by XAMPP's Apache)

  # ---------- Monitoring ----------

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d    # keep 15 days of metrics
    ports:
      - "9090:9090"   # Prometheus UI: graphs and http://localhost:9090/alerts

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aeromaint.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana: http://localhost:3000 (user admin, password from .env)

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
