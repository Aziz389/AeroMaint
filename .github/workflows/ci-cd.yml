# AeroMaint CI/CD pipeline
#
#   1. backend  : compile and package the Spring Boot jar          (every push and pull request)
#   2. frontend : install and build the Angular app                (every push and pull request)
#   3. images   : build both Docker images and push them to GHCR   (only on push to main, if 1 and 2 passed)
#   4. deploy   : copy the compose files to the server and restart (only if the DEPLOY_* secrets exist)
#
# Images go to GitHub Container Registry: ghcr.io/<owner>/aeromaint-backend and aeromaint-frontend,
# tagged "latest" and with the commit SHA (so any version can be rolled back).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push on the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven            # reuse downloaded Maven dependencies between runs

      - name: Package the jar
        working-directory: backend
        run: mvn -B package

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npx ng build --configuration production

  images:
    name: Build and push Docker images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # allows GITHUB_TOKEN to push to ghcr.io
    strategy:
      matrix:
        app: [backend, frontend]  # the same steps run twice, once per image
    steps:
      - uses: actions/checkout@v7

      # Registry names must be lowercase; the GitHub username may contain capitals.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aeromaint-${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic token, no secret to create

      - uses: docker/setup-buildx-action@v4

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to server
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read              # the server logs in to ghcr.io with this job's token to pull the images
    # Secrets cannot be used directly in a job "if", so they are copied to env and checked per step.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when no server is configured
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::No DEPLOY_HOST secret set, deployment skipped. See docs/deployment.md."

      - uses: actions/checkout@v7
        if: env.DEPLOY_HOST != ''

      - name: Copy compose files to the server
        if: env.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml,docker-compose.prod.yml
          target: ~/aeromaint

      - name: Pull the new images and restart
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/aeromaint
            export IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG=${{ github.sha }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f
